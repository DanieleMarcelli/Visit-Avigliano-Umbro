<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#e07a2f" />
<title>Il viaggio di Tumbo · Visit Avigliano Umbro</title>

<!--
  ============================================================================
  "Riporta Tumbo a casa" — prototipo single-file
  ----------------------------------------------------------------------------
  Gioco turistico per bambini (6-11) del territorio di Avigliano Umbro (TR).
  Un cucciolo di mammut si è perso nel presente: i bambini lo riportano a casa
  viaggiando indietro nel tempo, tappa dopo tappa, fino alla Foresta Fossile
  di Dunarobba (2 milioni di anni fa).

  TUTTO in un unico file: nessun build, nessuna dipendenza npm.
  Unica risorsa esterna: Leaflet (CSS+JS) + tile OpenStreetMap (no API key).

  Come evolvere il prototipo (cerca i commenti "TODO" nel codice):
    - verifica QR reale / geofencing sul pulsante "Sono arrivato!"
    - backend per attivare/disattivare tappe da remoto (ora: campo "attiva")
    - multilingua (ora: tutti i testi in italiano dentro la config)
  ============================================================================
-->

<!-- Leaflet da cdnjs (nessuna API key richiesta) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
/* ============================================================================
   PALETTE & TOKEN — calda e naturale: terra, arancio, verde bosco, azzurro paleolago
   ============================================================================ */
:root{
  --terra:      #6b4423;   /* marrone terra          */
  --terra-scuro:#4a2f18;
  --arancio:    #e07a2f;   /* mammut / accento caldo */
  --arancio-chiaro:#f4a259;
  --crema:      #fbf3e4;   /* sfondo carta           */
  --crema-scuro:#f2e5cf;
  --bosco:      #2f6b46;   /* verde bosco            */
  --bosco-chiaro:#4f9d6b;
  --paleolago:  #4a9fc4;   /* azzurro del lago       */
  --paleolago-chiaro:#7cc4e0;
  --oro:        #e8b04b;
  --testo:      #3a2b1a;
  --ombra:      rgba(74,47,24,.18);
  --raggio:     22px;
  --font: 'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
}

/* Codice colore per era (badge epoca) */
.era-oggi      { background:#5aa9e6; }
.era-900       { background:#8e7cc3; }
.era-medioevo  { background:#a9564a; }
.era-romana    { background:#c9992e; }
.era-preistoria{ background:#7d6b52; }
.era-fossile   { background:#2f6b46; }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:var(--font);
  color:var(--testo);
  background:var(--crema);
  overflow:hidden;
  position:fixed; width:100%;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}

/* ---- Header ---------------------------------------------------------------*/
header{
  position:fixed; top:0; left:0; right:0; height:56px; z-index:1200;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 14px;
  background:linear-gradient(120deg,var(--bosco),var(--bosco-chiaro));
  color:#fff; box-shadow:0 2px 12px var(--ombra);
}
header .logo{ display:flex; flex-direction:column; line-height:1.05; }
header .logo b{ font-size:15px; letter-spacing:.3px; }
header .logo small{ font-size:10px; opacity:.9; font-weight:600; }
header .menu-btn{
  width:40px; height:40px; border:none; border-radius:50%;
  background:rgba(255,255,255,.18); color:#fff; font-size:20px; cursor:pointer;
}

/* ---- Layout schermate -----------------------------------------------------*/
#map{ position:absolute; top:56px; bottom:0; left:0; right:0; z-index:1; background:var(--crema); }

/* Timeline progresso (viaggio nel tempo) */
#timeline-wrap{
  position:fixed; top:56px; left:0; right:0; z-index:900;
  background:rgba(251,243,228,.94); backdrop-filter:blur(4px);
  padding:8px 12px 10px; box-shadow:0 2px 8px var(--ombra);
}
#timeline-wrap .tl-labels{ display:flex; justify-content:space-between; font-size:10px; font-weight:700; color:var(--terra); margin-bottom:4px; }
.tl-track{ position:relative; height:12px; border-radius:8px; background:var(--crema-scuro); overflow:hidden; border:1px solid var(--crema-scuro); }
.tl-fill{
  position:absolute; top:0; left:0; height:100%;
  background:linear-gradient(90deg,var(--arancio),var(--oro),var(--bosco));
  width:0%; transition:width .8s cubic-bezier(.2,.8,.2,1); border-radius:8px;
}
.tl-dots{ display:flex; justify-content:space-between; margin-top:6px; }
.tl-dot{ width:14px; height:14px; border-radius:50%; background:var(--crema-scuro); border:2px solid #fff; box-shadow:0 1px 3px var(--ombra); transition:.3s; }
.tl-dot.done{ background:var(--bosco); }
.tl-dot.current{ background:var(--arancio); transform:scale(1.25); animation:pulse 1.4s infinite; }

/* ---- Marker mappa ---------------------------------------------------------*/
.marker-pin{
  width:38px; height:38px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px var(--ombra); border:3px solid #fff;
}
.marker-pin > *{ transform:rotate(45deg); font-size:18px; }
.marker-done   { background:var(--bosco); }
.marker-future { background:#9c9c9c; }
.marker-current{ background:var(--arancio); animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 3px 8px var(--ombra),0 0 0 0 rgba(224,122,47,.55);} 50%{ box-shadow:0 3px 8px var(--ombra),0 0 0 12px rgba(224,122,47,0);} }

/* ---- Widget mascotte flottante -------------------------------------------*/
#mascotte{
  position:fixed; right:12px; bottom:14px; z-index:1100;
  width:120px; cursor:pointer; user-select:none;
}
#mascotte svg{ width:100%; height:auto; display:block; filter:drop-shadow(0 6px 8px var(--ombra)); transition:transform .2s; }
#mascotte.festante svg{ animation:salto .6s ease infinite; }
#mascotte.pensieroso svg{ animation:oscilla 1.2s ease-in-out infinite; }
@keyframes salto{ 0%,100%{ transform:translateY(0) rotate(0);} 30%{ transform:translateY(-16px) rotate(-4deg);} 60%{ transform:translateY(-4px) rotate(3deg);} }
@keyframes oscilla{ 0%,100%{ transform:rotate(-3deg);} 50%{ transform:rotate(3deg);} }

/* Fumetto */
#fumetto{
  position:fixed; right:12px; bottom:150px; z-index:1100;
  max-width:min(78vw,320px); background:#fff; color:var(--testo);
  border:3px solid var(--arancio); border-radius:20px 20px 6px 20px;
  padding:12px 14px; font-size:14px; font-weight:600; line-height:1.35;
  box-shadow:0 8px 20px var(--ombra);
  transition:opacity .3s, transform .3s; transform-origin:bottom right;
}
#fumetto:after{ content:''; position:absolute; right:24px; bottom:-14px; border:8px solid transparent; border-top-color:var(--arancio); }
#fumetto.hidden{ opacity:0; transform:scale(.7); pointer-events:none; }

/* ---- Pannello / schede (bottom sheet) ------------------------------------*/
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:1300;
  max-height:88vh; overflow-y:auto;
  background:var(--crema); border-radius:26px 26px 0 0;
  box-shadow:0 -8px 30px var(--ombra);
  transform:translateY(102%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
  padding:10px 18px 26px;
}
.sheet.open{ transform:translateY(0); }
.sheet .grip{ width:44px; height:5px; border-radius:3px; background:var(--crema-scuro); margin:4px auto 12px; }
.sheet h2{ margin:6px 0 4px; font-size:22px; color:var(--terra-scuro); }
.badge-epoca{ display:inline-block; color:#fff; font-size:12px; font-weight:800; padding:4px 12px; border-radius:20px; letter-spacing:.5px; box-shadow:0 2px 5px var(--ombra); }
.racconto{ font-size:15px; line-height:1.5; margin:14px 0; background:#fff; border-radius:16px; padding:14px; border-left:5px solid var(--arancio-chiaro); }

/* Bottoni */
.btn{
  display:block; width:100%; border:none; border-radius:16px;
  padding:16px; font-family:var(--font); font-size:17px; font-weight:800;
  cursor:pointer; margin-top:12px; box-shadow:0 4px 0 rgba(0,0,0,.14); transition:transform .1s, box-shadow .1s;
}
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
.btn-arancio{ background:var(--arancio); color:#fff; }
.btn-bosco{ background:var(--bosco); color:#fff; }
.btn-oro{ background:var(--oro); color:var(--terra-scuro); }
.btn-ghost{ background:#fff; color:var(--terra); box-shadow:0 2px 0 var(--crema-scuro); }

/* Quiz */
.quiz h3{ font-size:17px; margin:18px 0 6px; color:var(--terra-scuro); }
.opzione{
  display:block; width:100%; text-align:left; background:#fff; border:3px solid var(--crema-scuro);
  border-radius:16px; padding:15px; font-family:var(--font); font-size:16px; font-weight:700; color:var(--testo);
  margin-top:10px; cursor:pointer; transition:.15s;
}
.opzione:active{ transform:scale(.98); }
.opzione.giusta{ border-color:var(--bosco); background:#e6f5ec; }
.opzione.sbagliata{ border-color:#d0563e; background:#fbe4de; animation:shake .4s; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

/* Collezione ricordi */
#ricordi-bar{
  position:fixed; bottom:14px; left:12px; z-index:1000;
  display:flex; gap:5px; background:rgba(255,255,255,.9); padding:6px 8px; border-radius:16px; box-shadow:0 3px 10px var(--ombra); max-width:56vw; flex-wrap:wrap;
}
.ricordo-slot{ width:30px; height:30px; border-radius:9px; background:var(--crema-scuro); display:flex; align-items:center; justify-content:center; font-size:18px; }
.ricordo-slot.pieno{ background:var(--oro); box-shadow:0 0 0 2px #fff inset; animation:pop .4s; }
@keyframes pop{ 0%{ transform:scale(0);} 70%{ transform:scale(1.3);} 100%{ transform:scale(1);} }

/* Menu a scomparsa */
#menu{
  position:fixed; top:56px; right:8px; z-index:1400; background:#fff; border-radius:16px;
  box-shadow:0 8px 24px var(--ombra); padding:8px; width:220px; display:none;
}
#menu.open{ display:block; }
#menu button{ width:100%; text-align:left; background:none; border:none; padding:12px; font-family:var(--font); font-size:15px; font-weight:700; color:var(--testo); border-radius:10px; cursor:pointer; }
#menu button:active{ background:var(--crema); }
#menu .danger{ color:#c0392b; }

/* ---- Finale (schermata celebrativa) --------------------------------------*/
#finale{
  position:fixed; inset:0; z-index:2000; display:none; overflow-y:auto;
  background:linear-gradient(180deg,#bfe3f2 0%, #dff0e4 55%, #e9dcc0 100%);
  text-align:center; padding:24px 18px 40px;
}
#finale.show{ display:block; }
#finale h1{ font-size:26px; color:var(--terra-scuro); margin:10px 0 2px; }
#finale p.sub{ font-size:15px; font-weight:700; color:var(--bosco); margin:0 0 8px; }
.scena-foresta{ width:100%; max-width:460px; margin:8px auto; }

/* Diploma */
.diploma{
  max-width:460px; margin:14px auto; background:#fffdf7; border:6px double var(--oro);
  border-radius:14px; padding:22px 20px; box-shadow:0 8px 24px var(--ombra);
}
.diploma h2{ font-size:22px; color:var(--terra); margin:4px 0; }
.diploma .nome-input{
  width:100%; text-align:center; font-family:var(--font); font-size:22px; font-weight:800;
  color:var(--arancio); border:none; border-bottom:3px dashed var(--arancio-chiaro);
  background:transparent; padding:6px; margin:10px 0;
}
.diploma .nome-input:focus{ outline:none; border-bottom-color:var(--arancio); }
.diploma .sigillo{ font-size:44px; margin:6px 0; }
.diploma .data{ font-size:13px; color:var(--terra); font-weight:700; }

/* Coriandoli */
.coriandolo{ position:fixed; top:-20px; width:11px; height:16px; z-index:2100; opacity:.9; animation:cade linear forwards; }
@keyframes cade{ to{ transform:translateY(110vh) rotate(720deg); opacity:.8; } }

/* Overlay generico */
.overlay-bg{ position:fixed; inset:0; z-index:1250; background:rgba(58,43,26,.35); display:none; }
.overlay-bg.show{ display:block; }

/* ============================================================================
   CSS DI STAMPA — solo il diploma finisce sulla carta
   ============================================================================ */
@media print{
  body{ position:static; overflow:visible; background:#fff; }
  header,#map,#mascotte,#fumetto,#ricordi-bar,#timeline-wrap,#menu,.sheet,.overlay-bg,.scena-foresta,#finale .btn,#finale h1,#finale p.sub,.coriandolo{ display:none !important; }
  #finale{ position:static; display:block !important; background:#fff; padding:0; }
  .diploma{ box-shadow:none; margin:0 auto; border-color:#b8860b; }
  .diploma .nome-input{ border-bottom:none; }
}
</style>
</head>
<body>

<!-- ============================ HEADER ==================================== -->
<header>
  <div class="logo">
    <b>Visit Avigliano Umbro</b>
    <small id="logo-sub">· Il viaggio di Tumbo</small>
  </div>
  <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
</header>

<!-- Menu a scomparsa (contiene "ricomincia avventura") -->
<div id="menu">
  <button id="btn-aiuto">💬 Cosa devo fare?</button>
  <button id="btn-ricentra">🗺️ Mostra tutta la mappa</button>
  <button class="danger" id="btn-reset">🔄 Ricomincia l'avventura</button>
</div>

<!-- ============================ TIMELINE ================================== -->
<div id="timeline-wrap">
  <div class="tl-labels"><span>OGGI</span><span id="tl-mid">↩ viaggio nel tempo</span><span>2 MILIONI DI ANNI FA</span></div>
  <div class="tl-track"><div class="tl-fill" id="tl-fill"></div></div>
  <div class="tl-dots" id="tl-dots"></div>
</div>

<!-- ============================ MAPPA ==================================== -->
<div id="map"></div>

<!-- ============================ RICORDI =================================== -->
<div id="ricordi-bar" title="I tuoi ricordi del viaggio"></div>

<!-- ============================ MASCOTTE ================================= -->
<!-- SVG inline disegnato a mano: cucciolo di mammut cartoon.
     Gli stati (normale/festante/pensieroso) sono gestiti via classi CSS sul contenitore. -->
<div id="mascotte" title="Tocca Tumbo!">
  <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-label="Tumbo il mammut">
    <!-- pelo/corpo tondo -->
    <ellipse cx="70" cy="88" rx="46" ry="40" fill="#c9772f"/>
    <ellipse cx="70" cy="92" rx="46" ry="36" fill="#e07a2f"/>
    <!-- ciuffo di pelo in testa -->
    <path d="M46 54 q6 -16 12 -2 q6 -16 12 -2 q6 -16 12 -2 q6 -14 10 2" fill="none" stroke="#a85e22" stroke-width="6" stroke-linecap="round"/>
    <!-- testa -->
    <ellipse cx="70" cy="66" rx="34" ry="30" fill="#e07a2f"/>
    <!-- orecchie -->
    <ellipse cx="40" cy="60" rx="10" ry="13" fill="#c9772f"/>
    <ellipse cx="100" cy="60" rx="10" ry="13" fill="#c9772f"/>
    <!-- occhi grandi -->
    <circle cx="58" cy="62" r="10" fill="#fff"/>
    <circle cx="82" cy="62" r="10" fill="#fff"/>
    <circle id="pupilla-sx" cx="60" cy="64" r="5" fill="#3a2b1a"/>
    <circle id="pupilla-dx" cx="84" cy="64" r="5" fill="#3a2b1a"/>
    <circle cx="62" cy="62" r="1.6" fill="#fff"/>
    <circle cx="86" cy="62" r="1.6" fill="#fff"/>
    <!-- zanne piccole -->
    <path d="M60 86 q-6 10 -2 16" fill="none" stroke="#fff6e0" stroke-width="6" stroke-linecap="round"/>
    <path d="M80 86 q6 10 2 16" fill="none" stroke="#fff6e0" stroke-width="6" stroke-linecap="round"/>
    <!-- proboscide espressiva -->
    <path id="proboscide" d="M70 74 q-2 22 -12 30 q-8 8 -2 14" fill="none" stroke="#e07a2f" stroke-width="12" stroke-linecap="round"/>
    <!-- guance -->
    <circle cx="48" cy="74" r="5" fill="#f4a25955"/>
    <circle cx="92" cy="74" r="5" fill="#f4a25955"/>
    <!-- piedini -->
    <ellipse cx="50" cy="122" rx="12" ry="7" fill="#c9772f"/>
    <ellipse cx="90" cy="122" rx="12" ry="7" fill="#c9772f"/>
  </svg>
</div>

<!-- Fumetto della mascotte -->
<div id="fumetto"></div>

<!-- ============================ OVERLAY + SCHEDA TAPPA =================== -->
<div class="overlay-bg" id="overlay-bg"></div>
<div class="sheet" id="sheet"></div>

<!-- ============================ FINALE =================================== -->
<div id="finale">
  <!-- Scena SVG: foresta viva ritrovata (sequoie + paleolago Tiberino sullo sfondo) -->
  <svg class="scena-foresta" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="220" fill="#bfe3f2"/>
    <!-- paleolago Tiberino -->
    <ellipse cx="200" cy="150" rx="220" ry="46" fill="#4a9fc4"/>
    <ellipse cx="200" cy="146" rx="220" ry="40" fill="#7cc4e0"/>
    <!-- colline -->
    <path d="M0 150 q100 -60 200 -10 q100 40 200 -10 V220 H0 Z" fill="#4f9d6b"/>
    <!-- sequoie (foresta fossile viva) -->
    <g>
      <rect x="60" y="70" width="16" height="110" rx="6" fill="#6b4423"/>
      <ellipse cx="68" cy="66" rx="34" ry="42" fill="#2f6b46"/>
      <ellipse cx="68" cy="40" rx="24" ry="30" fill="#3c8557"/>
    </g>
    <g>
      <rect x="320" y="60" width="18" height="120" rx="6" fill="#6b4423"/>
      <ellipse cx="329" cy="58" rx="38" ry="46" fill="#2f6b46"/>
      <ellipse cx="329" cy="30" rx="26" ry="32" fill="#3c8557"/>
    </g>
    <g>
      <rect x="188" y="86" width="14" height="94" rx="6" fill="#6b4423"/>
      <ellipse cx="195" cy="80" rx="30" ry="38" fill="#2f6b46"/>
    </g>
    <!-- Tumbo felice a casa -->
    <g transform="translate(150,120)">
      <ellipse cx="40" cy="44" rx="34" ry="28" fill="#e07a2f"/>
      <ellipse cx="40" cy="26" rx="24" ry="22" fill="#e07a2f"/>
      <circle cx="32" cy="24" r="6" fill="#fff"/><circle cx="48" cy="24" r="6" fill="#fff"/>
      <circle cx="33" cy="25" r="3" fill="#3a2b1a"/><circle cx="49" cy="25" r="3" fill="#3a2b1a"/>
      <path d="M40 32 q-2 16 -10 22" fill="none" stroke="#e07a2f" stroke-width="8" stroke-linecap="round"/>
      <path d="M32 40 q-4 8 -1 12" stroke="#fff6e0" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M48 40 q4 8 1 12" stroke="#fff6e0" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </svg>

  <p class="sub">🎉 EVVIVA! 🎉</p>
  <h1 id="finale-titolo">Tumbo è tornato a casa!</h1>
  <p style="max-width:440px;margin:6px auto 0;font-weight:600;" id="finale-testo"></p>

  <!-- Diploma -->
  <div class="diploma">
    <div class="sigillo">🏅</div>
    <p class="data" style="letter-spacing:2px;">DIPLOMA DI</p>
    <h2>Esploratore del Tempo</h2>
    <p style="font-weight:700;font-size:13px;margin:2px 0;">rilasciato a</p>
    <input class="nome-input" id="nome-bambino" placeholder="scrivi il tuo nome" maxlength="24" />
    <p style="font-weight:600;font-size:13px;margin:6px 0;">per aver riportato Tumbo il mammut<br>alla Foresta Fossile di Dunarobba,<br>viaggiando fino a <b>2 milioni di anni fa</b>.</p>
    <p class="data" id="diploma-data"></p>
  </div>

  <div style="max-width:440px;margin:0 auto;">
    <button class="btn btn-oro" id="btn-stampa">🖨️ Stampa / Salva il diploma</button>
    <button class="btn btn-ghost" id="btn-torna-mappa">🗺️ Torna alla mappa</button>
    <button class="btn btn-ghost" id="btn-nuova-avventura" style="margin-top:8px;">🔄 Nuova avventura</button>
  </div>
</div>

<script>
/* ============================================================================
   COSTANTE NOME MASCOTTE — cambiala qui per rinominare ovunque
   ============================================================================ */
const MASCOTTE_NOME = "Tumbo";

/* ============================================================================
   CONFIGURAZIONE TAPPE  (tutto il contenuto vive QUI, mai nel markup)
   ----------------------------------------------------------------------------
   Ordine di gioco = dal presente al passato profondo.
   Modifica liberamente lat/lon, testi, quiz. "attiva" accende/spegne la tappa.
   TODO(backend): in produzione questo array arriverà da un backend, che potrà
   attivare/disattivare le tappe da remoto (campo "attiva").
   TODO(multilingua): duplicare i campi testuali per lingua (es. testo_racconto_en).
   ============================================================================ */
const TAPPE = [
  {
    id: 1,
    nome: "Piazza di Avigliano Umbro",
    epoca: "OGGI",
    eraClass: "era-oggi",
    lat: 42.6555, lon: 12.4270,
    ricordo: "🎈",
    testo_racconto: "Ciao! Mi sono perso e sono finito nella tua piazza, ai giorni nostri! Che confusione: auto, gelati, tanta gente. Ma io vengo da tantissimo tempo fa... Aiutami a tornare a casa viaggiando indietro nel tempo!",
    domanda_quiz: "In che epoca ci troviamo adesso, nella piazza?",
    opzioni: ["Oggi, ai giorni nostri", "Nel Medioevo", "Un milione di anni fa"],
    risposta_corretta: 0,
    attiva: true
  },
  {
    id: 2,
    nome: "Teatro Comunale di Avigliano",
    epoca: "IL '900",
    eraClass: "era-900",
    lat: 42.6550, lon: 12.4265,
    ricordo: "🎭",

/* ============================================================================
   STATO DI GIOCO + localStorage
   ============================================================================ */
const STORAGE_KEY = "tumbo_avventura_v1";
let stato = caricaStato();

function statoIniziale(){
  return { completate: [], ricordi: [], nomeBambino: "", finaleVisto:false };
}
function caricaStato(){
  try{
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(s && Array.isArray(s.completate)) return Object.assign(statoIniziale(), s);
  }catch(e){}
  return statoIniziale();
}
function salvaStato(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stato)); }catch(e){}
}

/* Solo le tappe attive entrano nel gioco */
const tappeAttive = TAPPE.filter(t => t.attiva);

/* Indice della tappa corrente = prima tappa attiva non ancora completata */
function indiceCorrente(){
  for(let i=0;i<tappeAttive.length;i++){
    if(!stato.completate.includes(tappeAttive[i].id)) return i;
  }
  return tappeAttive.length; // tutte completate
}
function statoTappa(i){
  const t = tappeAttive[i];
  if(stato.completate.includes(t.id)) return "done";
  if(i === indiceCorrente()) return "current";
  return "future";
}

/* ============================================================================
   MAPPA LEAFLET
   ============================================================================ */
let map, markers = [], linea;

function initMappa(){
  // Se Leaflet non è disponibile (rete assente), mostra un avviso e non blocca il resto del gioco.
  if(typeof L === "undefined"){
    document.getElementById('map').innerHTML =
      '<div style="padding:40px 20px;text-align:center;font-weight:700;color:var(--terra);">' +
      '🗺️ Serve una connessione a internet per caricare la mappa.<br>Controlla la rete e ricarica la pagina.</div>';
    return;
  }
  map = L.map('map', { zoomControl:true, attributionControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // Linea tratteggiata = sentiero del viaggio nel tempo
  const punti = tappeAttive.map(t => [t.lat, t.lon]);
  linea = L.polyline(punti, { color:'#e07a2f', weight:4, dashArray:'2 12', opacity:.8, lineCap:'round' }).addTo(map);

  disegnaMarker();
  ricentra();
}

function iconaPer(i){
  const st = statoTappa(i);
  let cls = "marker-future", emoji = "🔒";
  if(st === "done"){ cls = "marker-done"; emoji = "✔️"; }
  else if(st === "current"){ cls = "marker-current"; emoji = "🐘"; }
  return L.divIcon({
    className:'', html:`<div class="marker-pin ${cls}"><span>${emoji}</span></div>`,
    iconSize:[38,38], iconAnchor:[19,38], popupAnchor:[0,-36]
  });
}

function disegnaMarker(){
  if(!map) return;
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  tappeAttive.forEach((t,i) => {
    const m = L.marker([t.lat,t.lon], { icon: iconaPer(i) }).addTo(map);
    m.on('click', () => onMarkerClick(i));
    markers.push(m);
  });
}

function onMarkerClick(i){
  const st = statoTappa(i);
  if(st === "future"){
    // Tappa bloccata: il mammut spiega che va in ordine
    setStato("pensieroso");
    parla(`Aspetta! Prima dobbiamo completare le tappe più vicine a oggi. Le tappe si aprono in ordine, dal presente al passato! 🔒`);
    return;
  }
  apriScheda(i);
}

function ricentra(){
  if(map && tappeAttive.length){
    map.fitBounds(L.latLngBounds(tappeAttive.map(t => [t.lat,t.lon])).pad(0.25));
  }
}

/* ============================================================================
   SCHEDA TAPPA + QUIZ
   ============================================================================ */
const sheet = document.getElementById('sheet');
const overlayBg = document.getElementById('overlay-bg');
let schedaCorrente = null;

function apriScheda(i){
  schedaCorrente = i;
  const t = tappeAttive[i];
  const gia = stato.completate.includes(t.id);

  // Il mammut racconta l'epoca
  setStato("normale");
  parla(t.testo_racconto);

  sheet.innerHTML = `
    <div class="grip"></div>
    <span class="badge-epoca ${t.eraClass}">${t.epoca}</span>
    <h2>${t.nome}</h2>
    <div class="racconto">🐘 «${t.testo_racconto}»</div>
    ${ gia ? renderQuizFatto(t) : renderArrivo(t) }
  `;
  aprSheet();
  cablaScheda(i, gia);
}

/* Fase 1: "Sono arrivato" (simula scansione QR).  */
function renderArrivo(t){
  return `
    <p style="font-weight:700;text-align:center;color:var(--terra);">Sei arrivato in questo luogo?</p>
    <button class="btn btn-arancio" id="btn-arrivato">Sono arrivato! 📍</button>
  `;
}
function renderQuiz(t){
  const opz = t.opzioni.map((o,idx) =>
    `<button class="opzione" data-idx="${idx}">${o}</button>`).join("");
  return `
    <div class="quiz" id="quiz-box">
      <h3>🧠 Indovinello dell'epoca</h3>
      <p style="font-weight:700;">${t.domanda_quiz}</p>
      ${opz}
    </div>
  `;
}
function renderQuizFatto(t){
  return `
    <div class="racconto" style="border-left-color:var(--bosco);background:#e6f5ec;">
      ✅ Tappa completata! Ricordo raccolto: <b style="font-size:20px;">${t.ricordo}</b>
    </div>
    <button class="btn btn-bosco" id="btn-prossima">Continua il viaggio →</button>
  `;
}

function cablaScheda(i, gia){
  const t = tappeAttive[i];

  if(gia){
    const b = document.getElementById('btn-prossima');
    if(b) b.onclick = () => { chiudiSheet(); vaiAllaCorrente(); };
    return;
  }

  const btnArr = document.getElementById('btn-arrivato');
  if(btnArr){
    btnArr.onclick = () => {
      // TODO(QR/geolocalizzazione): qui, in produzione, va la verifica reale.
      //   - QR: leggere il codice del cartello fisico e confrontarlo con t.id
      //   - Geofencing: navigator.geolocation + distanza da (t.lat,t.lon) < soglia
      // Nel prototipo sblocchiamo direttamente il quiz.
      setStato("normale");
      parla(`Perfetto, sei qui con me! Ora rispondi all'indovinello per aiutarmi a viaggiare nel tempo.`);
      const box = document.createElement('div');
      box.innerHTML = renderQuiz(t);
      btnArr.replaceWith(box.firstElementChild);
      cablaQuiz(i);
    };
  }
}

function cablaQuiz(i){
  const t = tappeAttive[i];
  document.querySelectorAll('#quiz-box .opzione').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx,10);
      if(idx === t.risposta_corretta){
        btn.classList.add('giusta');
        rispostaGiusta(i);
      }else{
        btn.classList.add('sbagliata');
        setStato("pensieroso");
        parla(`Ohh, quasi! Non è quella la risposta. Riprova, ci riusciamo insieme! 💪`);
        // Nessuna penalità: si può ritentare subito
        setTimeout(()=>btn.classList.remove('sbagliata'), 600);
      }
    };
  });
}

function rispostaGiusta(i){
  const t = tappeAttive[i];
  // Registra completamento + ricordo
  if(!stato.completate.includes(t.id)) stato.completate.push(t.id);
  if(!stato.ricordi.includes(t.ricordo)) stato.ricordi.push(t.ricordo);
  salvaStato();

  // Mammut festeggia
  setStato("festante");
  parla(`EVVIVA! Risposta giusta! Ho un nuovo ricordo: ${t.ricordo} — e si è aperta la prossima tappa!`);

  aggiornaTimeline();
  aggiornaRicordi();
  disegnaMarker();

  // Aggiorna la scheda a "completata"
  setTimeout(()=>{
    if(schedaCorrente === i){
      const box = document.getElementById('quiz-box');
      if(box){
        const done = document.createElement('div');
        done.innerHTML = renderQuizFatto(t);
        box.replaceWith(...done.childNodes);
        const b = document.getElementById('btn-prossima');
        if(b) b.onclick = () => { chiudiSheet(); vaiAllaCorrente(); };
      }
    }
  }, 700);

  // Ultima tappa completata → finale
  if(indiceCorrente() >= tappeAttive.length){
    setTimeout(()=>{ chiudiSheet(); mostraFinale(); }, 1600);
  }
}

function vaiAllaCorrente(){
  const i = indiceCorrente();
  if(i >= tappeAttive.length){ mostraFinale(); return; }
  const t = tappeAttive[i];
  if(map) map.flyTo([t.lat,t.lon], 15, { duration:1 });
  setStato("normale");
  parla(`La prossima tappa è: ${t.nome} (${t.epoca}). Tocca il mio marker 🐘 sulla mappa per continuare!`);
}

/* Bottom sheet open/close */
function aprSheet(){ sheet.classList.add('open'); overlayBg.classList.add('show'); }
function chiudiSheet(){ sheet.classList.remove('open'); overlayBg.classList.remove('show'); schedaCorrente=null; }
overlayBg.onclick = chiudiSheet;

/* ============================================================================
   MASCOTTE: stati + fumetto
   ============================================================================ */
const elMascotte = document.getElementById('mascotte');
const elFumetto  = document.getElementById('fumetto');
let fumettoTimer = null;

function setStato(s){
  elMascotte.classList.remove('festante','pensieroso');
  if(s === "festante") elMascotte.classList.add('festante');
  else if(s === "pensieroso") elMascotte.classList.add('pensieroso');
  // "normale" = nessuna classe extra
}

function parla(testo){
  elFumetto.textContent = testo;
  elFumetto.classList.remove('hidden');
  if(fumettoTimer) clearTimeout(fumettoTimer);
  // Il fumetto resta a lungo (bambini piccoli), poi si nasconde
  fumettoTimer = setTimeout(()=>elFumetto.classList.add('hidden'), 9000);
}

// Tap sul mammut = ripete l'indicazione utile del momento
elMascotte.onclick = () => {
  if(elFumetto.classList.contains('hidden')) suggerimentoCorrente();
  else elFumetto.classList.add('hidden');
};

function suggerimentoCorrente(){
  const i = indiceCorrente();
  setStato("normale");
  if(i >= tappeAttive.length){
    parla(`Ce l'abbiamo fatta insieme! Sono a casa, nella mia foresta. Grazie! 🌲`);
    return;
  }
  const t = tappeAttive[i];
  parla(`Portami a: ${t.nome} — ${t.epoca}. Tocca il mio marker 🐘 che pulsa sulla mappa!`);
}

/* ============================================================================
   TIMELINE (viaggio nel tempo) + RICORDI
   ============================================================================ */
function aggiornaTimeline(){
  const tot = tappeAttive.length;
  const fatte = stato.completate.filter(id => tappeAttive.some(t=>t.id===id)).length;
  document.getElementById('tl-fill').style.width = (fatte/tot*100) + "%";

  const dots = document.getElementById('tl-dots');
  dots.innerHTML = "";
  tappeAttive.forEach((t,i)=>{
    const d = document.createElement('div');
    d.className = "tl-dot " + (statoTappa(i)==="done"?"done":statoTappa(i)==="current"?"current":"");
    d.title = t.epoca;
    dots.appendChild(d);
  });
}

function aggiornaRicordi(){
  const bar = document.getElementById('ricordi-bar');
  bar.innerHTML = "";
  tappeAttive.forEach(t=>{
    const s = document.createElement('div');
    const preso = stato.ricordi.includes(t.ricordo);
    s.className = "ricordo-slot " + (preso?"pieno":"");
    s.textContent = preso ? t.ricordo : "";
    s.title = preso ? `Ricordo: ${t.nome}` : "Ricordo da scoprire";
    bar.appendChild(s);
  });
}

/* ============================================================================
   FINALE + coriandoli + diploma
   ============================================================================ */
function mostraFinale(){
  stato.finaleVisto = true; salvaStato();
  document.getElementById('finale-titolo').textContent = `${MASCOTTE_NOME} è tornato a casa!`;
  document.getElementById('finale-testo').textContent =
    `Hai riportato ${MASCOTTE_NOME} indietro nel tempo fino alla sua foresta di 2 milioni di anni fa. Sei un vero Esploratore del Tempo!`;
  document.getElementById('nome-bambino').value = stato.nomeBambino || "";
  document.getElementById('diploma-data').textContent = "Avigliano Umbro, " + dataOggi();
  document.getElementById('finale').classList.add('show');
  elFumetto.classList.add('hidden');
  coriandoli();
}

function dataOggi(){
  const d = new Date();
  return d.toLocaleDateString('it-IT', { day:'numeric', month:'long', year:'numeric' });
}

function coriandoli(){
  const colori = ['#e07a2f','#e8b04b','#2f6b46','#4a9fc4','#f4a259','#a9564a'];
  for(let k=0;k<90;k++){
    const c = document.createElement('div');
    c.className = 'coriandolo';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colori[k % colori.length];
    c.style.animationDuration = (2.5 + Math.random()*2.5) + 's';
    c.style.animationDelay = (Math.random()*1.5) + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 6000);
  }
}

/* Salva il nome del bambino mentre scrive */
document.getElementById('nome-bambino').addEventListener('input', e=>{
  stato.nomeBambino = e.target.value; salvaStato();
});
document.getElementById('btn-stampa').onclick = ()=> window.print();
document.getElementById('btn-torna-mappa').onclick = ()=>{
  document.getElementById('finale').classList.remove('show');
};
document.getElementById('btn-nuova-avventura').onclick = ()=> reset();

/* ============================================================================
   MENU (aiuto, ricentra, reset)
   ============================================================================ */
const menu = document.getElementById('menu');
document.getElementById('menu-btn').onclick = ()=> menu.classList.toggle('open');
document.addEventListener('click', e=>{
  if(!menu.contains(e.target) && e.target.id!=='menu-btn') menu.classList.remove('open');
});
document.getElementById('btn-aiuto').onclick = ()=>{ menu.classList.remove('open'); suggerimentoCorrente(); };
document.getElementById('btn-ricentra').onclick = ()=>{ menu.classList.remove('open'); ricentra(); };
document.getElementById('btn-reset').onclick = ()=>{
  menu.classList.remove('open');
  if(confirm("Vuoi ricominciare l'avventura da capo? I progressi verranno cancellati.")) reset();
};

function reset(){
  stato = statoIniziale();
  salvaStato();
  document.getElementById('finale').classList.remove('show');
  chiudiSheet();
  disegnaMarker();
  aggiornaTimeline();
  aggiornaRicordi();
  ricentra();
  vaiAllaCorrente();
}

/* ============================================================================
   AVVIO
   ============================================================================ */
document.getElementById('logo-sub').textContent = `· Il viaggio di ${MASCOTTE_NOME}`;
elMascotte.title = `Tocca ${MASCOTTE_NOME}!`;

// UI di base sempre attiva (indipendente dalla mappa)
aggiornaTimeline();
aggiornaRicordi();
// La mappa è best-effort: un errore non deve bloccare il gioco
try{ initMappa(); }catch(e){ console.warn("Mappa non inizializzata:", e); }

// Messaggio di benvenuto / ripresa
window.setTimeout(()=>{
  if(indiceCorrente() >= tappeAttive.length && stato.finaleVisto){
    parla(`Bentornato! Vuoi rivedere il finale? Apri il menu ☰ per ricominciare, oppure guarda la mappa completata!`);
  }else if(stato.completate.length > 0){
    setStato("normale");
    parla(`Bentornato, esploratore! Riprendiamo il viaggio da dove eravamo. Tocca il mio marker 🐘 sulla mappa!`);
  }else{
    setStato("normale");
    parla(`Ciao! Sono ${MASCOTTE_NOME}, un cucciolo di mammut, e mi sono perso ai giorni nostri! Aiutami a tornare a casa viaggiando indietro nel tempo. Iniziamo dalla piazza: tocca il mio marker 🐘!`);
  }
}, 700);
</script>
